name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: |
          node --check server.js && \
          node --check src/app.js && \
          node --check src/middleware.js && \
          node --check src/helpers.js && \
          node --check src/db.js && \
          node --check src/errors.js && \
          node --check lib/validate.js && \
          node --check src/routes/auth.js && \
          node --check src/routes/categories.js && \
          node --check src/routes/items.js && \
          node --check src/routes/settings.js && \
          node --check src/routes/spreadsheet.js && \
          node --check src/routes/upload.js && \
          node --check src/routes/backfill.js && \
          node --check src/routes/pages.js

      - name: Module load check
        run: node -e "require('./src/errors'); require('./lib/validate'); require('./src/helpers'); require('./src/db'); console.log('Modules OK')"

      - name: Run tests
        run: node --test
