<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse miniatures subcategory — detailed collection view with photos.">
  <title id="pageTitle">Category - skyfire Collection</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <link rel="stylesheet" href="/vendor/cropper.min.css">
  <script src="/js/theme-init.js"></script>
</head>
<body data-page-type="subgroup">
  <a href="#main-content" class="skip-link">Skip to content</a>
  <main id="main-content" role="main">
  <div class="section-page">
    <div class="back-nav">
      <a href="/" class="back-link"><span class="back-arrow">&larr;</span> <span class="back-text">Back to Home</span></a>
      <a id="backLink" href="/" class="back-link"><span class="back-arrow">&larr;</span> <span class="back-text">Back</span></a>
    </div>
    <h1 id="pageTitle2"></h1>
    <div class="category-grid" id="categoryGrid"></div>
    <div class="subgroup-items-section hidden" id="subgroupItemsSection">
      <h2 class="subgroup-items-heading">Items</h2>
      <div class="gallery-grid" id="subgroupItemsGrid"></div>
    </div>
  </div>
  </main>

  <div class="admin-corner">
    <button id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☀️</button>
    <button id="adminBtn" title="Admin" aria-label="Admin">🔐</button>
  </div>

  <div class="admin-actions hidden" id="adminActions">
    <a href="/admin#add">+ Add</a>
    <a href="/admin#spreadsheet" data-btn="spreadsheet">📊 CommanderHQ</a>
  </div>
  <div class="reorder-actions hidden" id="reorderActions"></div>

  <!-- Edit/Crop/Lightbox modals are injected by /js/shared-modals.js -->

  <div class="modal-overlay" id="authModal" role="dialog" aria-modal="true" aria-label="Admin login">
    <div class="modal">
      <h2 id="authTitle">Admin Login</h2>
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" placeholder="admin">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Password">
      </div>
      <div class="btn-row">
        <button class="btn" id="loginBtn">Login</button>
        <button class="btn btn-danger hidden" id="logoutBtn">Logout</button>
      </div>
      <p id="authError" class="danger-text" role="alert" aria-live="polite"></p>
    </div>
  </div>

  <script src="/vendor/cropper.min.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/section-pages.js"></script>
  <script type="module" src="/js/gallery-page.js"></script>
</body>
</html>
