<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photo gallery of dice and miniatures collection — browse items with lightbox and carousel view.">
  <title>Gallery - skyfire Collection</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg"><link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/gallery.css">
  <link rel="stylesheet" href="/vendor/cropper.min.css">
  <script src="/js/theme-init.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <main id="main-content" role="main">
  <div class="gallery-page">
    <div class="back-nav">
      <a id="galleryBackLink" href="/" class="back-link"><span class="back-arrow">&larr;</span> <span class="back-text">Back</span></a>
    </div>
    <h1 id="pageTitle"></h1>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
  </main>

  <div class="admin-corner">
    <button id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☀️</button>
    <button id="adminBtn" title="Admin" aria-label="Admin login">🔐</button>
  </div>

  <div class="admin-actions hidden" id="adminActions">
    <a href="/admin#add">+ Add</a>
    <a href="/admin#spreadsheet" data-btn="spreadsheet">📊 CommanderHQ</a>
  </div>
  <div class="reorder-actions hidden" id="reorderActions"></div>

  <!-- Edit/Crop/Lightbox modals are injected by /js/shared-modals.js;
       the auth modal is injected by /js/nav.js -->

  <script src="/vendor/cropper.min.js"></script>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/gallery-page.js"></script>
</body>
</html>
