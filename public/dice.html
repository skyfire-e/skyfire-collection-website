<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">Dice - skyf1re Collection</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg"><link rel="stylesheet" href="/css/base.css">
</head>
<body data-page-type="section">
  <div class="section-page">
    <a href="/" class="back-link"><span class="back-arrow">←</span> <span class="back-text">Back to Home</span></a>
    <h1 id="sectionTitle">Dice</h1>
    <div class="category-grid" id="categoryGrid"></div>
  </div>

  <div class="admin-corner">
    <button id="themeBtn" title="Toggle theme">☀️</button>
    <button id="adminBtn" title="Admin">🔐</button>
  </div>

  <div class="admin-actions hidden" id="adminActions">
    <button data-href="/admin#add">+ Add</button>
    <button data-href="/admin#spreadsheet">📊 CommanderHQ</button>
  </div>

  <div class="modal-overlay" id="authModal" role="dialog" aria-modal="true" aria-label="Admin login">
    <div class="modal">
      <h2 id="authTitle">Admin Login</h2>
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" placeholder="admin">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Password">
      </div>
      <div class="btn-row">
        <button class="btn" id="loginBtn">Login</button>
        <button class="btn btn-danger hidden" id="logoutBtn">Logout</button>
      </div>
      <p id="authError" class="danger-text"></p>
    </div>
  </div>

  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/section-pages.js"></script>
</body>
</html>
