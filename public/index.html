<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skyf1re collection</title>
  <meta name="description" content="Personal collection of dice and miniatures — photo gallery with lightbox, spreadsheet, and admin panel.">
  <meta property="og:title" content="skyf1re collection">
  <meta property="og:description" content="Personal collection of dice and miniatures.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg"><link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div class="home-page">
    <h1>skyf1re collection</h1>
    <div class="home-buttons">
      <a href="/dice" class="home-btn">
        <span class="icon">🎲</span>
        Dice
      </a>
      <a href="/miniatures" class="home-btn">
        <span class="icon">⚔️</span>
        Miniatures
      </a>
    </div>
  </div>

  <div class="spreadsheet-bar">
    <button class="ss-public-btn" data-href="/spreadsheet">📊 Spreadsheet</button>
  </div>

  <div class="admin-corner">
    <button id="themeBtn" title="Toggle theme">☀️</button>
    <button id="adminBtn" title="Admin">🔐</button>
  </div>

  <div class="admin-actions hidden" id="adminActions">
    <button data-href="/admin#add">+ Add</button>
    <button data-href="/admin#spreadsheet">📊 CommanderHQ</button>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h2 id="authTitle">Admin Login</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Password">
      </div>
      <div class="btn-row">
        <button class="btn" id="loginBtn">Login</button>
        <button class="btn btn-danger hidden" id="logoutBtn">Logout</button>
      </div>
      <p id="authError" class="danger-text"></p>
    </div>
  </div>

  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
