<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spreadsheet - skyf1re Collection</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div class="section-page">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h1>Spreadsheet</h1>
    <div class="csv-export-bar">
      <button id="csvBtn" class="btn btn-sm" title="Export to CSV">📥 Export CSV</button>
    </div>
    <div id="spreadsheetContainer"></div>
  </div>

  <div class="admin-corner">
    <button id="themeBtn" title="Toggle theme">☀️</button>
    <button id="adminBtn" title="Admin">🔐</button>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h2 id="authTitle">Admin Login</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Password">
      </div>
      <div class="btn-row">
        <button class="btn" id="loginBtn">Login</button>
        <button class="btn btn-danger hidden" id="logoutBtn">Logout</button>
      </div>
      <p id="authError" class="danger-text"></p>
    </div>
  </div>

  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/spreadsheet-page.js"></script>
</body>
</html>
