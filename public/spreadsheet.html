<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Full collection spreadsheet — browse all items with prices, categories, and CSV export.">
  <title>Spreadsheet - skyfire Collection</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/theme-init.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <main id="main-content" role="main">
  <div class="section-page">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h1>Spreadsheet</h1>
    <div class="csv-export-bar">
      <button id="csvBtn" class="btn btn-sm" title="Export to CSV">📥 Export CSV</button>
    </div>
    <div id="spreadsheetContainer"></div>
  </div>
  </main>

  <div class="admin-actions hidden" id="adminActions">
    <a href="/admin#add">+ Add</a>
    <a href="/admin#spreadsheet" data-btn="spreadsheet">📊 CommanderHQ</a>
  </div>

  <div class="admin-corner">
    <button id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☀️</button>
    <button id="adminBtn" title="Admin" aria-label="Admin">🔐</button>
  </div>

  <!-- Auth modal is injected by /js/nav.js from /js/shared-modals.js -->

  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/spreadsheet-page.js"></script>
</body>
</html>
